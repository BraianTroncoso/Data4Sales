; Ingesta de lotes grandes: el limite real lo pone la validacion del
; sobre (tamano maximo de lote), no el runtime. Estos valores solo
; evitan que PHP corte antes de que nuestra propia guarda lo haga.
memory_limit = 512M
post_max_size = 32M
upload_max_filesize = 32M
max_execution_time = 120

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000

; Nunca exponer errores al cliente: el input de la API es no confiable
; y un stack trace filtra estructura interna.
display_errors = Off
log_errors = On
error_log = /dev/stderr
