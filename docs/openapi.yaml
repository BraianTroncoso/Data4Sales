openapi: 3.1.0

info:
  title: Data4Sales — API de ventas
  version: "1.0"
  description: |
    API de una plataforma B2B multi-tenant. Tiene dos superficies con
    responsabilidades distintas:

    - **Ingesta** — el único camino por el que los datos entran al sistema.
      No existe ningún proceso que lea archivos: los datos se envían acá.
    - **Consulta** — expone lo ingerido y alimenta el dashboard.

    ## Autenticación

    Una API key por tenant, en `Authorization: Bearer <clave>`. La clave
    determina **a qué datos se accede y sobre cuáles se escribe**: no hay
    ningún parámetro que seleccione el tenant, y un `tenant_id` que venga en
    el cuerpo es un dato a validar, jamás una fuente de autoridad.

    Los alcances están separados. Una credencial de ingesta no puede leer el
    padrón de compradores, que es donde vive el dato personal.

    ## Ingesta asincrónica

    `POST /ingest/{entity}` responde **202**, no 201. El lote quedó guardado y
    aceptado para procesar, pero todavía no está reflejado en las tablas de
    negocio. Entre "entregado" y "aceptado" hay una ventana, y el endpoint de
    estado la hace observable en vez de esconderla.

    ## Dinero

    Todos los montos son **enteros en la unidad mínima** de su moneda
    (centavos), con el código ISO-4217 al lado. Nunca vienen formateados:
    formatear en la API obligaría a cualquier consumidor que quiera sumar a
    re-parsear un número que nosotros mismos rompimos.

    Ojo con el exponente: el peso chileno y el yen no tienen decimales, así
    que `1000 CLP` son mil pesos, no diez.

servers:
  - url: http://localhost:8080/api/v1
    description: Entorno local levantado con docker compose

security:
  - ApiKey: []

tags:
  - name: Ingesta
    description: El único punto de entrada de datos al sistema.
  - name: Clientes
    description: Padrón de compradores. Expone datos personales.
  - name: Órdenes
  - name: Métricas
    description: |
      Agregados que alimentan la pantalla de estadísticas. Ninguna de estas
      consultas toca la tabla de órdenes: todas leen tablas derivadas, con una
      fila por día o por cliente. El costo depende del rango pedido, no del
      volumen de ventas que haya adentro.

paths:

  /ingest/{entity}:
    post:
      tags: [Ingesta]
      summary: Enviar un lote de registros
      description: |
        Valida el sobre, persiste el lote crudo en disco, encola el
        procesamiento y responde 202 con el identificador del lote.

        El guardado es **sincrónico** y la normalización **asincrónica**. Va en
        ese orden porque responder 202 significa "me hago cargo de esto": si el
        guardado fuera asincrónico, una caída entre la respuesta y la escritura
        perdería datos que el retailer ya considera entregados.
      operationId: ingestBatch
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum: [orders, customers, products]
          description: |
            Sólo `orders` se normaliza hoy: las órdenes traen su comprador y
            sus renglones anidados, que es como los mandan los retailers. Los
            otros dos tipos se aceptan y quedan en la zona cruda sin volcarse
            al modelo. Está declarado en el README.
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: |
            Reenviar el mismo lote con la misma clave devuelve el lote original
            en vez de crear uno nuevo. Es lo que hace seguro reintentar tras un
            timeout de red.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestEnvelope' }
            examples:
              orden_limpia:
                summary: Una orden bien formada
                value:
                  source: daily_stream
                  records:
                    - order_id: ORD-1001
                      status: paid
                      currency: ARS
                      total: "12345.67"
                      placed_at: "2026-08-01T10:00:00-03:00"
                      updated_at: "2026-08-01T10:00:00-03:00"
                      customer:
                        customer_id: CUS-1
                        name: María González
                        email: maria@example.test
                        country: AR
                      items:
                        - product_id: P-1
                          sku: SKU-1
                          name: Remera
                          category: indumentaria
                          quantity: 2
                          unit_price: "1000.00"
              suciedad:
                summary: Registros sucios, para ver cómo los trata
                description: |
                  Monto con coma decimal latina, fecha sin zona horaria (se
                  interpreta en la del tenant), email inválido (se conserva el
                  cliente y se marca el email), y un registro que dice
                  pertenecer a otro tenant (se descarta).
                value:
                  source: daily_stream
                  records:
                    - order_id: SUCIA-1
                      status: complete
                      currency: ARS
                      total: "1.234,56"
                      placed_at: "2026-08-01 22:30:00"
                      customer: { customer_id: CUS-2, email: "no es un mail" }
                      items: []
                    - order_id: AJENA-1
                      tenant_id: 00000000-0000-4000-8000-000000000000
                      status: paid
                      currency: ARS
                      total: "100.00"
                      placed_at: "2026-08-01T10:00:00-03:00"
                      customer: { customer_id: CUS-3, email: x@example.test }
                      items: []
              envio_cortado:
                summary: Un envío que se corta a la mitad
                description: |
                  Se anuncian 3 registros y llegan 2. El lote queda en estado
                  `partial` con la cuenta exacta, y reenviarlo completo es
                  seguro: lo ya ingerido se cuenta como duplicado.
                value:
                  source: historical_backfill
                  expected_count: 3
                  records:
                    - order_id: CORTE-1
                      status: paid
                      currency: ARS
                      total: "500.00"
                      placed_at: "2026-08-01T10:00:00-03:00"
                      customer: { customer_id: CUS-4, email: a@example.test }
                      items: []
                    - order_id: CORTE-2
                      status: paid
                      currency: ARS
                      total: "600.00"
                      placed_at: "2026-08-01T11:00:00-03:00"
                      customer: { customer_id: CUS-5, email: b@example.test }
                      items: []
      responses:
        '202':
          description: Lote recibido y encolado. **No** significa "aceptado".
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Batch' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinAlcance' }
        '404':
          description: Tipo de entidad desconocido.
        '422':
          description: |
            El sobre no es válido: lote vacío, `source` desconocido, o más
            registros que el máximo acordado con el tenant.

  /ingest/batches/{batch}:
    get:
      tags: [Ingesta]
      summary: Estado de un lote
      description: |
        Un lote de otro tenant es **indistinguible de uno inexistente**:
        Row-Level Security lo hace invisible antes de que el controlador lo
        vea, así que la respuesta no filtra que existe.
      operationId: batchStatus
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Batch' }
          description: Estado y cuentas del lote.
        '404': { description: No existe (o es de otro tenant). }

  /ingest/batches/{batch}/rejects:
    get:
      tags: [Ingesta]
      summary: Qué se rechazó y por qué
      description: |
        Agrupado por motivo tipado. Existe porque un contador de rechazos sin
        el detalle obliga al retailer a adivinar: convierte "300 registros
        fallaron" en "300 registros con la fecha en un formato que no
        interpretamos", que es accionable.
      operationId: batchRejects
      parameters:
        - { name: batch, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resumen por motivo y una muestra de casos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id: { type: string, format: uuid }
                  summary:
                    type: array
                    items:
                      type: object
                      properties:
                        reason: { $ref: '#/components/schemas/RejectReason' }
                        total: { type: integer }
                        what_arrived: { type: string, description: Qué llegó mal. }
                        what_we_did: { type: string, description: Qué hizo el sistema. }
                  samples:
                    type: array
                    items:
                      type: object
                      properties:
                        reason: { $ref: '#/components/schemas/RejectReason' }
                        field: { type: [string, "null"] }
                        source_id: { type: [string, "null"] }
                        message: { type: string }

  /customers:
    get:
      tags: [Clientes]
      summary: Listado de compradores, con búsqueda y filtros
      description: |
        **El email viene enmascarado.** Un listado se pagina, se exporta y se
        copia; que no lleve el contacto completo hace que una exportación
        accidental de mil filas no sea una fuga de mil contactos. El detalle sí
        lo muestra.

        La búsqueda **ignora acentos**: un agente escribe "gonzalez", no
        "González". Se resuelve con un índice trigrama sobre la forma sin
        acentos, así que no degrada a recorrer la tabla.

        Paginación **por cursor**, no por página: con cientos de miles de filas,
        `OFFSET 50000` obliga al motor a contar y descartar cincuenta mil filas
        antes de devolver nada.
      operationId: listCustomers
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Busca por email, nombre o identificador de origen. Ignora acentos.
        - name: segment
          in: query
          schema: { $ref: '#/components/schemas/RfmSegment' }
        - name: country
          in: query
          schema: { type: string, minLength: 2, maxLength: 2 }
        - name: email_status
          in: query
          schema: { type: string, enum: [valid, invalid, missing] }
        - name: sort
          in: query
          schema: { type: string, enum: [last_seen_at, name, external_id], default: last_seen_at }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Página de compradores.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerListItem' }
        '403': { $ref: '#/components/responses/SinAlcance' }

  /customers/{customer}:
    get:
      tags: [Clientes]
      summary: Detalle de un comprador con su historial
      description: |
        Acá sí viaja el contacto completo: es la pantalla donde un agente
        atiende un caso puntual, y ocultarle el email al que tiene que
        responder sería seguridad de utilería.

        Devuelve el email **tal como lo mandó el retailer**, no el normalizado:
        si está mal escrito, el agente necesita ver el error para corregirlo.
      operationId: showCustomer
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CustomerDetail' }
          description: Perfil, métricas e historial de órdenes.
        '404': { description: No existe (o es de otro tenant). }

  /orders:
    get:
      tags: [Órdenes]
      summary: Listado de órdenes, filtrable por fecha y estado
      description: |
        Los filtros de fecha van contra `placed_on`, el día calendario **en la
        zona del tenant**, precalculado. Filtrar por el timestamp obligaría a
        convertir zona horaria sobre cada fila y anularía el índice; y además
        daría resultados que no coinciden con lo que el retailer llama "el
        martes".
      operationId: listOrders
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - name: status
          in: query
          schema: { type: string }
          description: Uno o varios separados por coma, p. ej. `cancelled,returned`.
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - name: net_only
          in: query
          schema: { type: boolean }
          description: Excluye canceladas y devueltas.
        - name: late_arrivals
          in: query
          schema: { type: boolean }
          description: Sólo las que llegaron con más de un día de atraso.
        - { name: per_page, in: query, schema: { type: integer, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
          description: Página de órdenes.

  /orders/{order}:
    get:
      tags: [Órdenes]
      summary: Detalle de una orden con sus ítems y su historial de estados
      operationId: showOrder
      parameters:
        - { name: order, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
          description: La orden con ítems, historial y comprador.
        '404': { description: No existe (o es de otro tenant). }

  /metrics/sales-series:
    get:
      tags: [Métricas]
      summary: Evolución temporal de revenue y cantidad de órdenes
      operationId: salesSeries
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - name: granularity
          in: query
          schema: { type: string, enum: [day, week, month], default: day }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  range:
                    type: object
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      granularity: { type: string }
                  currency: { type: string }
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        bucket: { type: string, format: date }
                        orders_count: { type: integer }
                        items_count: { type: integer }
                        cancelled_count: { type: integer }
                        returned_count: { type: integer }
                        gross_minor: { type: integer, description: Bruto, en unidad mínima. }
                        net_minor: { type: integer, description: Sin canceladas ni devueltas. }
                  freshness: { $ref: '#/components/schemas/Freshness' }
          description: Serie agregada por día, semana o mes.

  /metrics/segments:
    get:
      tags: [Métricas]
      summary: Segmentación de compradores por comportamiento de compra
      description: |
        RFM con puntajes por quintiles **dentro de cada tenant**. Un cliente
        "campeón" de una tienda de barrio no es comparable con uno de una
        cadena: medirlo contra el resto de la plataforma no significaría nada.
      operationId: segments
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency: { type: string }
                  segments:
                    type: array
                    items:
                      type: object
                      properties:
                        segment: { $ref: '#/components/schemas/RfmSegment' }
                        label: { type: string }
                        customers: { type: integer }
                        revenue_minor: { type: integer }
                        avg_ticket_minor: { type: integer }
                  freshness: { $ref: '#/components/schemas/Freshness' }
          description: Reparto de compradores por segmento.

  /metrics/top-products:
    get:
      tags: [Métricas]
      summary: Productos o categorías que más facturan
      operationId: topProducts
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - name: by
          in: query
          schema: { type: string, enum: [product, category], default: product }
        - { name: limit, in: query, schema: { type: integer, maximum: 50, default: 10 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  grouped_by: { type: string }
                  currency: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        product_id: { type: [string, "null"], format: uuid }
                        units: { type: integer }
                        revenue_minor: { type: integer }
                  freshness: { $ref: '#/components/schemas/Freshness' }
          description: Top por revenue en el rango.

  /metrics/retention:
    get:
      tags: [Métricas]
      summary: Recompra
      description: |
        Se eligió la tasa de recompra sobre una cohorte clásica por una razón
        práctica: se calcula enteramente sobre `customer_metrics`, que tiene una
        fila por cliente. Una cohorte mes a mes exigiría recorrer el historial
        completo y dejaría de responder en el tenant grande, que es justo donde
        la métrica importa.
      operationId: retention
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency: { type: string }
                  buyers: { type: integer }
                  repeat_buyers: { type: integer }
                  repeat_rate: { type: number, format: float }
                  repeat_revenue_share:
                    type: number
                    format: float
                    description: |
                      Cuánto del negocio depende de que la gente vuelva. Suele
                      ser el número que más mueve decisiones, y casi nunca se
                      mira.
                  avg_orders_per_buyer: { type: number, format: float }
                  freshness: { $ref: '#/components/schemas/Freshness' }
          description: Métricas de recompra del tenant.

components:

  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer d4s_...`

        También se acepta `X-API-Key`, porque muchos pipelines de retailers no
        pueden mandar cabeceras de autorización arbitrarias.

        El secreto se guarda hasheado con SHA-256, no con bcrypt. Va a
        contramano del reflejo habitual y es deliberado: el costo de bcrypt
        existe para frenar fuerza bruta contra secretos que eligió un humano;
        contra uno aleatorio de 256 bits no compra nada, y además bcrypt no se
        puede indexar, así que autenticar exigiría comparar contra todas las
        claves en cada request.

  responses:
    NoAutenticado:
      description: |
        Credencial ausente, inválida o revocada. Los tres casos devuelven lo
        mismo: distinguirlos le diría a quien prueba credenciales si una clave
        existe pero está revocada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinAlcance:
      description: La credencial es válida pero no tiene el alcance requerido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [unauthenticated, forbidden, not_found, unknown_entity] }
            message: { type: string }

    IngestEnvelope:
      type: object
      required: [source, records]
      properties:
        source:
          type: string
          enum: [historical_backfill, daily_stream]
          description: |
            Las dos situaciones que el sistema distingue. La carga histórica
            trae meses de una vez y ensucia cientos de días de agregados; el
            flujo diario trae poco volumen pero mucha actualización de estado.
        expected_count:
          type: integer
          minimum: 1
          description: |
            Cuántos registros anuncia el emisor. Si llegan menos, el lote queda
            `partial`. Sin este número, "mandaron pocos" y "se cortó a la
            mitad" se ven idénticos desde el servidor.
        records:
          type: array
          minItems: 1
          description: |
            **No se validan uno por uno acá.** Rechazar el lote entero por un
            campo malo en uno de diez mil es lo contrario de lo que hace falta:
            la suciedad se maneja registro por registro en el pipeline, cada
            problema queda anotado con su motivo, y el resto del lote sigue.
          items: { $ref: '#/components/schemas/OrderRecord' }

    OrderRecord:
      type: object
      description: |
        Todos los campos son tolerantes a formato. Los montos aceptan las dos
        convenciones decimales; las fechas, seis formatos y con o sin zona.
      properties:
        order_id: { type: string, description: Identificador de origen. Sin él el registro se descarta. }
        tenant_id:
          type: string
          description: |
            Si viene y no coincide con el tenant de la credencial, el registro
            se descarta. Y si esa validación fallara, la política `WITH CHECK`
            de PostgreSQL rechazaría el INSERT igual.
        status: { type: string, description: "Acepta sinónimos: complete, canceled, refunded." }
        currency: { type: string, description: ISO-4217. Una moneda desconocida descarta el registro. }
        total: { type: [string, number], description: '"1.234,56" y "1,234.56" se interpretan bien los dos.' }
        placed_at: { type: [string, integer], description: ISO, epoch, o formato latino. Sin zona se interpreta en la del tenant. }
        updated_at: { type: [string, integer], description: Guarda de versión. Una actualización más vieja que lo guardado se ignora. }
        customer:
          type: object
          properties:
            customer_id: { type: string }
            name: { type: string }
            email: { type: string, description: Un email inválido NO descarta al comprador. Se marca y se conserva. }
            phone: { type: string }
            country: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string }
              sku: { type: string }
              name: { type: string }
              category: { type: string }
              quantity: { type: integer }
              unit_price: { type: [string, number] }

    Batch:
      type: object
      properties:
        batch_id: { type: string, format: uuid }
        status:
          type: string
          enum: [received, processing, completed, partial, failed]
          description: |
            `partial` **no es un fallo**: es un envío que llegó incompleto, o
            que quedó a medio procesar. Los registros que sí llegaron se
            procesan igual. Distinguirlo de `completed` dice que hay que
            reenviar; distinguirlo de `failed` evita descartar lo que ya entró.
        entity_type: { type: string }
        source: { type: string }
        counts:
          type: object
          properties:
            expected: { type: [integer, "null"] }
            received: { type: integer }
            accepted: { type: integer }
            rejected: { type: integer }
            duplicate: { type: integer, description: Duplicados exactos, atrapados por índice único. }
            pending: { type: integer }
        received_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        failure_reason: { type: [string, "null"] }
        links: { type: object }

    CustomerListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        external_id: { type: string }
        name: { type: [string, "null"] }
        email_masked: { type: [string, "null"], example: "ma***ez@example.test" }
        email_status: { type: string, enum: [valid, invalid, missing] }
        country: { type: [string, "null"] }
        last_seen_at: { type: string, format: date-time }
        metrics: { $ref: '#/components/schemas/CustomerMetrics' }

    CustomerDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        external_id: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"], description: Tal como lo mandó el retailer. }
        email_normalized: { type: [string, "null"] }
        email_status: { type: string }
        phone: { type: [string, "null"] }
        country: { type: [string, "null"] }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        metrics: { $ref: '#/components/schemas/CustomerMetrics' }
        orders:
          type: array
          items: { $ref: '#/components/schemas/Order' }

    CustomerMetrics:
      type: object
      properties:
        orders_count: { type: integer }
        net_orders_count: { type: integer, description: Sin canceladas ni devueltas. }
        returns_count: { type: integer }
        total_net_reporting_minor: { type: integer }
        avg_order_reporting_minor: { type: integer }
        recency_days: { type: [integer, "null"] }
        segment: { $ref: '#/components/schemas/RfmSegment' }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        external_id: { type: string }
        status: { type: string, enum: [created, paid, shipped, delivered, cancelled, returned] }
        currency: { type: string }
        total_amount_minor: { type: integer, description: En la moneda original. }
        reporting_amount_minor: { type: integer, description: En la moneda de reporte del tenant. }
        fx_rate:
          type: number
          description: |
            La tasa **del día de la orden**, congelada. Convertir con la tasa de
            hoy haría que el revenue de marzo cambiara cada vez que alguien abre
            el dashboard, y ningún reporte sería reproducible.
        placed_at: { type: string, format: date-time, description: Cuándo ocurrió en el mundo real. }
        placed_on: { type: string, format: date, description: El día calendario en la zona del tenant. }
        received_at: { type: string, format: date-time, description: Cuándo nos llegó. }
        arrival_lag_days:
          type: integer
          description: |
            La diferencia entre los dos anteriores **es** la definición de dato
            tardío. Está expuesta a propósito: hace visible el problema en vez
            de dejarlo enterrado.
        customer_id: { type: string, format: uuid }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        status_history:
          type: array
          description: |
            Incluye las actualizaciones **ignoradas** por llegar desordenadas
            (aparecen con el mismo estado de origen y destino). Sin eso, "por
            qué esta orden quedó así" no tendría respuesta.
          items:
            type: object
            properties:
              from: { type: [string, "null"] }
              to: { type: string }
              occurred_at: { type: string, format: date-time }
              received_at: { type: string, format: date-time }

    OrderItem:
      type: object
      properties:
        id: { type: integer }
        product_id: { type: string, format: uuid }
        product:
          type: object
          properties:
            external_id: { type: string }
            sku: { type: [string, "null"] }
            name: { type: string }
            category: { type: [string, "null"] }
        quantity: { type: integer }
        unit_amount_minor: { type: integer }
        total_amount_minor: { type: integer }
        currency: { type: string }

    Freshness:
      type: object
      description: |
        Cuán actualizados están los agregados. Es la respuesta operativa a
        "llega una orden de hace 60 días, ¿qué queda mal y por cuánto tiempo?".
        Un dashboard que no dice cuán viejo es su dato invita a decisiones
        tomadas sobre números que ya cambiaron.
      properties:
        pending_days: { type: integer }
        oldest_pending_minutes: { type: [integer, "null"] }
        is_stale: { type: boolean }

    RfmSegment:
      type: string
      enum: [champions, loyal, potential_loyalist, new_customers, at_risk, hibernating, lost]

    RejectReason:
      type: string
      description: Motivo tipado. Agrupar por acá convierte la tabla de suciedad del README en una consulta.
      enum:
        - missing_field
        - empty_field
        - invalid_type
        - foreign_tenant
        - missing_identifier
        - invalid_amount
        - unknown_currency
        - unknown_status
        - malformed_date
        - email_invalid
        - stale_update
